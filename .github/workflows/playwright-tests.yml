name: Playwright Tests

on:
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same PR to avoid wasted minutes
concurrency:
  group: playwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read repo contents
permissions:
  contents: read

jobs:
  playwright-tests:
    name: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true

    steps:
      # Check out the PR branch
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js LTS with Yarn cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies reproducibly; fails if lockfile is out of date
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers and their OS-level dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run the full Playwright test suite in parallel
      - name: Run Playwright tests
        run: npx playwright test

      # Always upload the HTML report so failures are diagnosable
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      # Always upload traces for failed/retried tests
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace*.zip
          retention-days: 14

      # Notify Teams channel when the workflow fails
      - name: Notify Microsoft Teams on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              "summary": "Playwright Tests Failed",
              "themeColor": "FF0000",
              "title": "❌ Playwright Tests Failed",
              "sections": [{
                "facts": [
                  { "name": "PR Title",  "value": "${{ github.event.pull_request.title }}" },
                  { "name": "PR Author", "value": "${{ github.event.pull_request.user.login }}" },
                  { "name": "Branch",    "value": "${{ github.head_ref }}" },
                  { "name": "Run URL",   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                ]
              }]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
